[build]
  publish = "public"
  command = "npm run build"

# Désactiver complètement le traitement automatique des assets
[build.processing]
  skip_processing = true

# Désactiver la minification automatique qui cause des blocages
[build.processing.html]
  skip = true

[build.processing.css]
  skip = true

[build.processing.js]
  skip = true

[build.processing.images]
  skip = true

[build.environment]
  NODE_VERSION = "20.11.0"
  NPM_VERSION = "10.2.4"

# Plugin Gatsby réactivé avec configuration 2024
[[plugins]]
  package = "@netlify/plugin-gatsby"
  [plugins.inputs]
    # Configuration optimisée pour 2024
    disableGatsbyPluginNetlify = false

# Cache pour accélérer les builds suivants
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirections
[[redirects]]
  from = "/une-histoire-dans-l-assiette"
  to = "/une-histoire-dans-l-assiette/"
  status = 301

# Variables d'environnement optimisées selon documentation Netlify 2024
[context.production.environment]
  # Configuration Node.js optimisée
  NODE_OPTIONS = "--max-old-space-size=4096"
  
  # Optimisations Gatsby recommandées 2024
  GATSBY_CPU_COUNT = "2"
  GATSBY_EXPERIMENTAL_PARALLEL_QUERY_RUNNING = "true"
  GATSBY_EXPERIMENTAL_QUERY_ON_DEMAND = "true"
  
  # Désactiver les fonctionnalités expérimentales problématiques
  GATSBY_EXPERIMENTAL_PAGE_BUILD_ON_DATA_CHANGES = "false"
  GATSBY_EXPERIMENTAL_FAST_DEV = "false"
  GATSBY_EXPERIMENTAL_DISABLE_WEBPACK_CACHE = "false"
  GATSBY_EXPERIMENTAL_DISABLE_HTML_MINIFICATION = "false"
  
  # Configuration Netlify 2024
  NETLIFY_USE_YARN = "false"
  NETLIFY_BUILD_BASE = "/opt/build"
