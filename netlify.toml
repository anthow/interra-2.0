[build]
  publish = "public"
  command = "npm run build"

# Désactiver complètement le traitement automatique des assets
[build.processing]
  skip_processing = true

# Désactiver la minification automatique qui cause des blocages
[build.processing.html]
  skip = true

[build.processing.css]
  skip = true

[build.processing.js]
  skip = true

[build.processing.images]
  skip = true

[build.environment]
  NODE_VERSION = "20.11.0"
  NPM_VERSION = "10.2.4"

# Plugin Gatsby avec configuration optimisée selon documentation officielle
[[plugins]]
  package = "@netlify/plugin-gatsby"

# Cache pour accélérer les builds suivants
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirections
[[redirects]]
  from = "/une-histoire-dans-l-assiette"
  to = "/une-histoire-dans-l-assiette/"
  status = 301

# Configuration optimisée selon documentation officielle Gatsby/Netlify 2024
[context.production.environment]
  # Configuration Node.js selon documentation Netlify
  NODE_OPTIONS = "--max-old-space-size=4096"
  
  # Optimisations Gatsby selon documentation officielle
  GATSBY_CPU_COUNT = "2"
  GATSBY_EXPERIMENTAL_PARALLEL_QUERY_RUNNING = "true"
  
  # Configuration Netlify recommandée
  NETLIFY_USE_YARN = "false"
