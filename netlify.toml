[build]
  publish = "public"
  command = "npm run build"
  timeout = "30"

# Désactiver complètement le traitement automatique des assets
[build.processing]
  skip_processing = true

# Désactiver la minification automatique qui cause des blocages
[build.processing.html]
  skip = true

[build.processing.css]
  skip = true

[build.processing.js]
  skip = true

[build.processing.images]
  skip = true

[build.environment]
  NODE_VERSION = "20.11.0"
  NPM_VERSION = "10.2.4"

# Optimisations de build - Plugin Gatsby désactivé pour éviter les blocages
# [[plugins]]
#   package = "@netlify/plugin-gatsby"

# Cache pour accélérer les builds suivants
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirections
[[redirects]]
  from = "/une-histoire-dans-l-assiette"
  to = "/une-histoire-dans-l-assiette/"
  status = 301

# Variables d'environnement pour optimiser Gatsby
[context.production.environment]
  GATSBY_CPU_COUNT = "4"
  GATSBY_EXPERIMENTAL_PAGE_BUILD_ON_DATA_CHANGES = "false"
  GATSBY_EXPERIMENTAL_PARALLEL_QUERY_RUNNING = "true"
  GATSBY_EXPERIMENTAL_FAST_DEV = "true"
  GATSBY_EXPERIMENTAL_QUERY_ON_DEMAND = "true"
  NETLIFY_USE_YARN = "false"
  # Optimisations pour éviter les timeouts
  GATSBY_DISABLE_QUERY_ON_DEMAND = "false"
  GATSBY_EXPERIMENTAL_DISABLE_WEBPACK_CACHE = "false"
  # Variables pour éviter les timeouts
  NODE_OPTIONS = "--max-old-space-size=8192"
  # Désactiver la minification HTML qui cause des blocages
  GATSBY_EXPERIMENTAL_DISABLE_HTML_MINIFICATION = "true"
  # Variables pour forcer Netlify à continuer
  NETLIFY_BUILD_BASE = "/opt/build"
  NETLIFY_BUILD_LIFECYCLE_TX = "true"
  # Optimisations supplémentaires
  GATSBY_EXPERIMENTAL_FAST_REFRESH = "true"
  GATSBY_EXPERIMENTAL_DEV_SSR = "false"
